name: Test npm cache image size
on:
  push:
    branches:
      - reduce-pnpm-docker-image-size
  workflow_dispatch:

jobs:
  build:
    name: Build and inspect npm cache mount image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker buildx build \
            --file .github/docker-size-tests/Dockerfile.npx-cache \
            --load \
            --tag preflight:npx-cache \
            .

      - name: Verify pnpm and Preflight
        run: |
          expected_pnpm_version="$(node --print "require('./docker/package.json').devEngines.packageManager.version")"
          actual_pnpm_version="$(docker run --rm --entrypoint pnpm preflight:npx-cache --version)"
          echo "Expected pnpm version: $expected_pnpm_version"
          echo "Actual pnpm version: $actual_pnpm_version"
          test "$actual_pnpm_version" = "$expected_pnpm_version"
          docker run --rm --entrypoint sh preflight:npx-cache -c 'command -v preflight'

      - name: Export compressed image
        run: |
          docker buildx build \
            --file .github/docker-size-tests/Dockerfile.npx-cache \
            --output "type=oci,dest=${RUNNER_TEMP}/npx-cache.oci.tar" \
            --provenance=false \
            .

      - name: Inspect compressed image size
        run: |
          mkdir "${RUNNER_TEMP}/npx-cache-oci"
          tar \
            --extract \
            --file "${RUNNER_TEMP}/npx-cache.oci.tar" \
            --directory "${RUNNER_TEMP}/npx-cache-oci"
          manifest_digest="$(jq --raw-output '.manifests[0].digest' "${RUNNER_TEMP}/npx-cache-oci/index.json")"
          manifest_path="${RUNNER_TEMP}/npx-cache-oci/blobs/sha256/${manifest_digest#sha256:}"
          compressed_layer_bytes="$(jq '[.layers[].size] | add' "$manifest_path")"
          echo "Compressed layer bytes: $compressed_layer_bytes"
          jq --raw-output '.layers[] | "\(.size)\t\(.digest)"' "$manifest_path"
